project:
  type: website
  render:
    - "**/*.qmd"
    - "!code/"

website:
  title: "Residual Thoughts"
  site-url: "https://www.residual-thoughts.com"
  favicon: favicon.png
  navbar:
    left:
      - text: "About"
        href: about.qmd
  open-graph: true
  twitter-card: true
  page-footer:
    left: "&copy; 2025–2026 Residual Thoughts"
    center: "Notes on mechanistic interpretability, geometry, and model behavior."
    right: |
      <a href="https://github.com/shubhamx64" title="GitHub">
        <i class="bi bi-github"></i> shubhamx64
      </a>
      &nbsp;&middot;&nbsp;
      <a href="mailto:shubham.lumia@gmail.com" title="Email">
        <i class="bi bi-envelope"></i>
      </a>

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    html-math-method: katex
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

execute:
  freeze: auto
