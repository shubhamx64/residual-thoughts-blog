project:
  type: website
  render:
    - "**/*.qmd"
    - "!code/"

website:
  title: "Residual Thoughts"
  description: "Notes on mechanistic interpretability, geometry, and model behavior."
  site-url: "https://www.residual-thoughts.com"
  favicon: favicon.png
  navbar:
    left:
      - text: "About"
        href: about.qmd
  open-graph:
    image: og_default.png
  twitter-card:
    image: og_default.png
    card-style: summary_large_image
  page-footer:
    left: "&copy; 2025–2026 Residual Thoughts"
    center: "Notes on mechanistic interpretability, geometry, and model behavior."
    right: |
      <a href="https://github.com/shubhamx64" title="GitHub">
        <i class="bi bi-github"></i> shubhamx64
      </a>
      &nbsp;&middot;&nbsp;
      <a href="mailto:shubham.lumia@gmail.com" title="Email">
        <i class="bi bi-envelope"></i>
      </a>

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    html-math-method: katex
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500;1,6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    include-after-body:
      - stream.html

execute:
  freeze: auto
